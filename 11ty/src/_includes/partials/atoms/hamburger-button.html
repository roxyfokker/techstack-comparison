{% macro hamburgerButton(close = false) %}
	<button
		class="hamburger-button{% if close %} hamburger-button--close{% endif %}"
		popovertarget="menu"
		popovertargetaction="{{ 'hide' if close else 'show' }}"
	>
		<span class="visually-hidden">{{ 'Sluit menu' if close else 'Menu' }}</span>
		<svg
			class="hamburger"
			fill="var(--color-brand-darkest)"
			viewBox="0 0 100 100"
			width="100"
			aria-hidden="true"
		>
			<rect class="line top" width="80" height="5" x="10" y="25" rx="5"></rect>
			<rect class="line middle" width="80" height="5" x="10" y="45" rx="5"></rect>
			<rect class="line bottom" width="80" height="5" x="10" y="65" rx="5"></rect>
		</svg>
	</button>
{% endmacro %}
